<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Food Donation System{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div class="wrap bar">
      <a class="brand" href="{{ url_for('index') }}">🍲 FoodShare</a>
      <nav>
        <a href="{{ url_for('donor_register') }}">Register Donor</a>
        <a href="{{ url_for('donate') }}">Post Donation</a>
        <a href="{{ url_for('available') }}">Available Food</a>
        <a href="{{ url_for('pickups') }}">Pickups</a>
        <a href="{{ url_for('track') }}">Tracking</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
